[package]
name = "steveql-fmt"
version = "0.1.0"
edition = "2021"
description = "An opinionated SQL formatter for the objectively-best SQL format."
license = "MIT"
repository = "https://github.com/jleight/steveql-fmt"
# Released through GitHub, not crates.io.
publish = false

[[bin]]
name = "steveql-fmt"
path = "src/main.rs"

[profile.release]
opt-level = 3

[dependencies]
serde_json = "1.0.154"
sqlparser = { version = "0.64.0", features = ["visitor"] }
