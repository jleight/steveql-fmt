[tools]
rust = "latest"
goreleaser = "latest"
zig = "latest"
"github:rust-cross/cargo-zigbuild" = "latest"
"github:EmbarkStudios/cargo-about" = "latest"

[tasks.build]
description = "Compile the project (cargo build)"
run = "cargo build"

[tasks.run]
description = "Run the formatter (cargo run -- <args>)"
run = "cargo run --"

[tasks.format]
description = "Format Rust source (cargo fmt)"
run = "cargo fmt"

[tasks.test]
description = "Run the test suite (cargo test)"
run = "cargo test"

[tasks.check]
description = "Type-check without building artifacts (cargo check)"
run = "cargo check"

[tasks.clippy]
description = "Lint with clippy, denying warnings"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.lint]
description = "Check formatting, lint with clippy, and check the release config"
run = [
    "cargo fmt --check",
    "cargo clippy --all-targets -- -D warnings",
    "goreleaser check",
]

[tasks.lint-fix]
description = "Format then lint"
alias = "fix"
depends = ["format", "clippy"]

[tasks."release:snapshot"]
description = "Build the release archives locally without publishing them"
run = "goreleaser release --snapshot --clean"

[tasks.examples]
description = "Reformat the example SQL files in place"
run = "cargo run -- --write examples/*.sql"

[tasks.lsp]
description = "Run the formatting language server over stdio"
run = "cargo run -- lsp"
